name: App Store

on:
  push:
    branches:
      - 'release/**'
  # Lets Start release run this on the branch it pushes, since pushes made with
  # the workflow token don't start workflows. Only release branches are built
  workflow_dispatch:

env:
  XCODE_CONFIG: Prod
  TFL_API_APP_KEY: ${{ secrets.TFL_API_APP_KEY }}
  TUBE_SERVICE_API_KEY: ${{ secrets.TUBE_SERVICE_API_KEY }}    
  APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
  APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
  APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
  MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  DISTRIBUTION_GROUPS: 'Beta Testers'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build and upload
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: xcode-27
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
      - name: Confirm Xcode version
        run: xcodebuild -version
      - name: Install gems
        run: bundle install
      - name: Sync signing
        run: bundle exec fastlane sync_signing
      # - name: Unit tests
      #   run: bundle exec fastlane unit_tests
      - name: Build
        run: bundle exec fastlane build
      - name: Distribute
        run: bundle exec fastlane distribute
      - name: Upload metadata
        run: bundle exec fastlane upload_metadata


  # Manual approval job
  submit-for-review:
    name: Submit for review
    runs-on: xcode-27
    needs: build-and-upload
    environment:
      name: app-store
    permissions:
      contents: write # To push the release tag and create the GitHub release
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Install gems
        run: bundle install
      - name: Submit for review
        # Same workflow run as the build job, so this is the build number it uploaded
        run: bundle exec fastlane submit_for_review build_number:"$GITHUB_RUN_NUMBER"
      - name: Read version
        id: versions
        run: bundle exec fastlane release_versions
      # Tags the submitted commit with its version. A resubmission after
      # rejection moves the tag, so it always marks what was last sent to App Review
      - name: Tag release
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          git tag --force "$VERSION"
          git push --force origin "refs/tags/$VERSION"
      # The App Store release notes, followed by GitHub's changelog link. A
      # resubmission replaces the release (not the tag), so it's always current
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          gh release delete "$VERSION" --yes 2>/dev/null || true
          gh release create "$VERSION" --verify-tag --title "$VERSION" \
            --notes-file fastlane/metadata/en-GB/release_notes.txt --generate-notes

  # Manual approval job. Approve it once Apple has approved the version
  publish:
    name: Publish
    runs-on: xcode-27
    needs: submit-for-review
    environment:
      name: app-store
    permissions:
      contents: write # To delete the release branch
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Install gems
        run: bundle install
      - name: Publish
        run: bundle exec fastlane publish
      # Submit for review tagged this commit, so the branch has nothing more to
      # keep. The lease leaves it alone if anything was pushed after this build
      - name: Delete release branch
        run: |
          if git ls-remote --exit-code --heads origin "$GITHUB_REF" > /dev/null; then
            git push --force-with-lease="$GITHUB_REF:$GITHUB_SHA" origin ":$GITHUB_REF"
          else
            echo "${GITHUB_REF#refs/heads/} is already deleted"
          fi
