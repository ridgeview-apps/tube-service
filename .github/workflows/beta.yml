name: Beta

on:
  push:
    branches:
      - main

env:
  XCODE_CONFIG: Beta
  TFL_API_APP_KEY: ${{ secrets.TFL_API_APP_KEY }}
  TUBE_SERVICE_API_KEY: ${{ secrets.TUBE_SERVICE_API_KEY }}  
  APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
  APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
  APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
  MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-deploy-beta:
    runs-on: xcode-27
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Confirm Xcode version
        run: xcodebuild -version
      - name: Install gems
        run: bundle install
      - name: Install dependencies
        run: |
          brew untap aws/tap || true
          brew install librsvg
          brew install imagemagick
      - name: Swift format lint
        run: Scripts/swift-format-lint.sh          
      - name: Sync signing
        run: bundle exec fastlane sync_signing
      - name: Unit tests
        run: bundle exec fastlane unit_tests
      - name: Add badge overlay
        run: bundle exec fastlane add_badge_overlay
      - name: Build
        run: bundle exec fastlane build
      - name: Distribute
        run: bundle exec fastlane distribute