name: Branch checks

on:
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'
  workflow_dispatch: # Allow this workflow to be triggered manually

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true    

jobs:
  checks:
    runs-on: xcode-27
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app"
      - name: Confirm Xcode version
        run: xcodebuild -version
      - name: Swift format lint
        run: Scripts/swift-format-lint.sh          
      - name: Install gems
        run: bundle install
      - name: Unit tests
        run: bundle exec fastlane unit_tests