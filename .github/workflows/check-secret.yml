name: Check Secret

# Prints a fingerprint of a repository secret for comparison with a local
# value from Scripts/fingerprint-secret.sh. Never prints the secret itself.
#
#   gh workflow run check-secret.yml -f secret_name=TFL_API_APP_KEY
#   gh run watch
#
# The repo is public, so run logs are too. Only high-entropy secrets (API keys,
# IDs, private keys) are listed: a fingerprint of a guessable value such as
# MATCH_PASSWORD could be brute-forced, so it is deliberately left out.

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: Secret to fingerprint
        required: true
        type: choice
        options:
          - TFL_API_APP_KEY
          - TUBE_SERVICE_API_KEY
          - APP_STORE_CONNECT_API_KEY_KEY_ID
          - APP_STORE_CONNECT_API_KEY_ISSUER_ID
          - APP_STORE_CONNECT_API_KEY_KEY
          - MATCH_GIT_PRIVATE_KEY

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Fingerprint ${{ inputs.secret_name }}
        # Passed via env rather than interpolated into the script, so the value
        # never becomes part of a shell command.
        env:
          SECRET_VALUE: ${{ secrets[inputs.secret_name] }}
        run: printf '%s' "$SECRET_VALUE" | Scripts/fingerprint-secret.sh
