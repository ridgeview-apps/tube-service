name: Prod

on:
  push:
    branches:
      - 'release/**'

env:
  XCODE_CONFIG: Prod
  TFL_API_APP_KEY: ${{ secrets.TFL_API_APP_KEY }}
  TUBE_SERVICE_API_KEY: ${{ secrets.TUBE_SERVICE_API_KEY }}    
  APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
  APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
  APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
  MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  DISTRIBUTION_GROUPS: 'Beta Testers'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-deploy-prod:
    runs-on: xcode-27
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Confirm Xcode version
        run: xcodebuild -version
      - name: Install gems
        run: bundle install
      - name: Sync signing
        run: bundle exec fastlane sync_signing
      # - name: Unit tests
      #   run: bundle exec fastlane unit_tests
      - name: Build
        run: bundle exec fastlane build
      - name: Distribute
        run: bundle exec fastlane distribute


  # Manual approval job
  submit-for-review:
    runs-on: macos-latest
    needs: build-and-deploy-prod
    environment:
      name: prod
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install gems
        run: bundle install
      - name: Submit for review
        run: bundle exec fastlane submit_for_review